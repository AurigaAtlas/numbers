name: Generate voice pack

# Records every phrase with the open-source MeloTTS Korean voice and commits the
# clips to public/voice. Run it from the Actions tab whenever the app's lines change.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-record every clip (not only new phrases)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List phrases
        run: node scripts/voice/build-catalog.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scripts/voice/requirements.txt
      - name: Install MeloTTS
        run: |
          pip install -r scripts/voice/requirements.txt
          python -m unidic download
      - name: Record clips
        run: python scripts/voice/generate.py --device cpu ${{ inputs.force && '--force' || '' }}
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voice scripts/voice/phrases.json
          if git diff --cached --quiet; then
            echo "No new clips."
            exit 0
          fi
          git commit -m "Record voice pack with MeloTTS"
          # Recording takes a while; the branch may have moved on in the meantime.
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            sleep 10
          done
          $pushed || { echo "Could not push the recorded clips."; exit 1; }
          # Pushes made with the workflow token do not start other workflows, so deploy explicitly.
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
          fi
